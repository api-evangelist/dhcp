aid: dhcp
name: DHCP
description: >-
  Dynamic Host Configuration Protocol (DHCP) is a network management protocol
  used to automate the process of configuring devices on IP networks. DHCP
  dynamically assigns IP addresses and other network configuration parameters to
  each device on a network, enabling them to communicate with other IP networks.
